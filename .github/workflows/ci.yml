name: ci

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  unit-tests:
    name: Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go fmt
        run: |
          ! go fmt ./... | read
      - name: Go vet
        run: |
          ! go vet ./... | read
      - name: Go Test
        run: SKIP_INTEGRATION_TESTS=1 go test -v ./...

  release-dry-run:
    name: Release Dry Run
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run GoReleaser in snapshot mode
        uses: goreleaser/goreleaser-action@v5
        with:
          version: ~> v1
          args: release --snapshot --clean
        env:
          CGO_ENABLED: 0
      - name: Check npm package version matches release-please manifest
        run: test "$(jq -r .version npm/package.json)" = "$(jq -r '.["."]' .release-please-manifest.json)"
      - name: Build npm binary
        run: CGO_ENABLED=0 go build -ldflags "-X main.version=v$(jq -r .version npm/package.json)" -a -installsuffix cgo -o ./npm/terratag ./cmd/terratag
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack, install and run npm package
        run: |
          npm pack ./npm --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm install "$RUNNER_TEMP"/env0-terratag-*.tgz
          ./node_modules/@env0/terratag/terratag -version | tee version.txt
          grep -qx "Terratag v$(jq -r .version "$GITHUB_WORKSPACE/npm/package.json")" version.txt

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["12", "13", "14", "15", "latest"]

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go
      - name: Get dependencies
        run: |
          go mod tidy
      - name: Install tfenv
        run: |
          git clone https://github.com/tfutils/tfenv.git $GITHUB_WORKSPACE/.tfenv
          echo "$GITHUB_WORKSPACE/.tfenv/bin" >> $GITHUB_PATH
      - name: Install terraform
        working-directory: test/tfenvconf/terraform_${{ matrix.terraform_version }}
        run: |
          tfenv install
          tfenv use
      - name: Print Terraform version
        run: |
          terraform --version
      - name: Set Test-Suite
        id: test-suite
        env:
          TF_VERSION: ${{ matrix.terraform_version }}
        uses: actions/github-script@v6
        with:
          script: |
            console.log(`Setting test suite version based on ${process.env.TF_VERSION}`)
            const suite = process.env.TF_VERSION.replace('.', 'o')
            console.log(`Test suite set to ${suite}`)
            return suite
          result-encoding: string

      - name: Test
        run: |
          go test -v -run ^TestTerraform${{ steps.test-suite.outputs.result }}

  terragrunt-integration-tests:
    name: Terragrunt Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix:
        terragrunt_version:
          # Below TerragruntRunMinVersion (0.78.0): exercises the legacy
          # code path, which does not use the 'run' command.
          - "0.77.20"
          # Exact TerragruntRunMinVersion: the boundary where terratag
          # switches from the legacy invocation to 'run'.
          - "0.78.0"
          # First version where terragrunt stopped forwarding unknown
          # top-level commands (the break reported in #230). Confirms
          # the 'run' command fix works.
          - "0.88.1"
          # Later 0.x release, further from the 0.88.0 boundary, to
          # catch regressions before the 1.x line.
          - "0.95.1"
          # First stable major release.
          - "1.0.0"
          # Catches upcoming breaking changes early; non-blocking (see
          # continue-on-error below) so it can't fail master CI.
          - "latest"
        include:
          - terragrunt_version: "latest"
            continue_on_error: true
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go
      - name: Get dependencies
        run: |
          go mod tidy
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Print Terraform version
        run: |
          terraform --version
      - name: Install Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ matrix.terragrunt_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print Terragrunt version
        run: |
          terragrunt --version
      - name: Test
        run: |
          go test -v -run ^TestTerragrunt.*$

  opentofu-integration-tests:
    name: OpenTofu Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go
      - name: Get dependencies
        run: |
          go mod tidy
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: Print OpenTofu version
        run: |
          tofu --version
      - name: Test
        run: |
          go test -v -run ^TestOpenTofu$
